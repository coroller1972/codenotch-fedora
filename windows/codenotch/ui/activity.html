<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Activity</title>
<style>
  /* The Mac's TimelinePane: one day of work as lanes over its hours, or a week or a month as a
     bar per day, then every session grouped by project with what it cost */
  :root{
    color-scheme:dark;
    --bg:#1e1e20; --panel:#2a2a2d; --line:rgba(255,255,255,.08); --grid:rgba(255,255,255,.06);
    --text:#f2f2f4; --text2:rgba(235,235,245,.62); --hover:rgba(255,255,255,.04);
    --seg:rgba(255,255,255,.08); --seg-on:#636366; --accent:#d9785a;
  }
  :root[data-theme="light"]{
    color-scheme:light;
    --bg:#f5f5f7; --panel:#ffffff; --line:rgba(0,0,0,.08); --grid:rgba(0,0,0,.06);
    --text:#1d1d1f; --text2:rgba(60,60,67,.70); --hover:rgba(0,0,0,.035);
    --seg:rgba(0,0,0,.06); --seg-on:#ffffff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font:13px/1.35 system-ui,"Segoe UI",sans-serif;overflow-y:auto}
  main{padding:30px 48px 32px 56px;display:flex;flex-direction:column;gap:22px;min-width:0}
  button,select{font:inherit;color:var(--text)}
  .top{display:flex;align-items:baseline;gap:12px}
  h1{font-size:20px;font-weight:600;margin:0}
  .sub{font-size:13px;color:var(--text2);margin-top:4px}
  .nav{margin-left:auto;display:flex;gap:6px}
  .nav button{background:var(--seg);border:0;border-radius:6px;padding:4px 10px;cursor:pointer}
  .nav button:disabled{opacity:.4;cursor:default}
  .controls{display:flex;gap:12px;align-items:center}
  .seg{display:inline-flex;background:var(--seg);border-radius:7px;padding:2px;gap:2px}
  .seg button{border:0;background:transparent;border-radius:5px;padding:3px 18px;cursor:pointer}
  .seg button.on{background:var(--seg-on);box-shadow:0 1px 2px rgba(0,0,0,.2)}
  select{background:var(--seg);border:0;border-radius:6px;padding:4px 8px;min-width:200px}
  .stats{display:flex;gap:28px;align-items:flex-end;flex-wrap:wrap}
  .stat b{display:block;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
  .stat span{font-size:11px;color:var(--text2)}
  .legend{margin-left:auto;display:flex;gap:10px;font-size:11px;color:var(--text2)}
  .legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:8px}
  .empty b{display:block;font-weight:500}
  .empty span{font-size:12px;color:var(--text2)}
  /* Lanes */
  .lanes{padding:14px}
  .axis,.lane{display:grid;grid-template-columns:150px 1fr}
  .axis .hours{position:relative;height:18px}
  .axis .hours span{position:absolute;transform:translateX(-50%);font-size:10px;color:var(--text2);font-variant-numeric:tabular-nums}
  .lane{padding:5px 0;border-top:1px solid var(--line);align-items:center}
  .lane .who{padding-right:10px;min-width:0}
  .lane .who b{display:block;font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lane .who span{font-size:10px;color:var(--text2)}
  .track{position:relative;height:22px}
  .track .tick{position:absolute;top:0;bottom:0;width:1px;background:var(--grid)}
  .track .bar{position:absolute;top:4px;height:14px;border-radius:3px;opacity:.9;min-width:4px}
  .track .bar.dim{opacity:.35}
  /* Bars per day */
  .days{padding:16px}
  .cols{display:flex;align-items:flex-end;height:160px}
  .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;min-width:0;height:100%}
  .col .v{font-size:9px;color:var(--text2);white-space:nowrap;font-variant-numeric:tabular-nums;min-height:11px}
  .col .b{width:100%;border-radius:3px;background:var(--accent);opacity:.55;min-height:3px}
  .col.today .b,.col:hover .b{opacity:1}
  .col .d{font-size:10px;color:var(--text2)}
  .col.today .d{color:var(--text);font-weight:600}
  .caption{display:flex;margin-top:8px;font-size:11px;color:var(--text2);font-variant-numeric:tabular-nums}
  .caption .total{margin-left:auto;font-weight:500}
  /* Projects */
  .project h2{display:flex;align-items:baseline;gap:8px;font-size:13px;font-weight:600;margin:0 2px 6px}
  .project h2 span{font-size:12px;font-weight:400;color:var(--text2)}
  .project h2 b{margin-left:auto;font-variant-numeric:tabular-nums}
  .srow{display:flex;align-items:center;gap:12px;padding:8px 12px}
  .srow+.srow{border-top:1px solid var(--line)}
  .srow:hover,.srow.hot{background:var(--hover)}
  .srow .strip{width:3px;height:28px;border-radius:2px;flex:none}
  .srow .when{width:110px;flex:none}
  .srow .when b{display:block;font-size:12px;font-weight:500;font-variant-numeric:tabular-nums}
  .srow .when span,.srow .meta{font-size:10.5px;color:var(--text2)}
  .srow .what{flex:1;min-width:0}
  .srow .what b{display:block;font-weight:400;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .srow .chip{font-size:10px;font-weight:600;padding:1px 5px;border-radius:8px;margin-right:6px}
  .srow .cost{width:90px;text-align:right;font-size:12px;font-weight:500;font-variant-numeric:tabular-nums;flex:none}
</style>
</head>
<body>
<main>
  <div>
    <div class="top">
      <div><h1 id="title">Activity</h1><div class="sub" id="range"></div></div>
      <div class="nav">
        <button id="prev" aria-label="Previous">‹</button>
        <button id="today">Today</button>
        <button id="next" aria-label="Next">›</button>
        <button id="reload" aria-label="Refresh">↻</button>
      </div>
    </div>
  </div>
  <div class="controls">
    <span class="seg" id="period"><button data-v="day">Day</button><button data-v="week">Week</button><button data-v="month">Month</button></span>
    <select id="account" aria-label="Account"></select>
  </div>
  <div class="stats" id="stats"></div>
  <div id="chart"></div>
  <div id="projects" style="display:flex;flex-direction:column;gap:22px"></div>
</main>
<script>
const invoke = window.__TAURI__.core.invoke;
const listen = window.__TAURI__.event.listen;

/* ---- Words ---------------------------------------------------------------- */
const T = {
  'pt-BR': {Activity:'Atividade',Today:'Hoje',Day:'Dia',Week:'Semana',Month:'Mês','All accounts':'Todas as contas',Sessions:'Sessões','Active time':'Tempo ativo',Turns:'Turnos','Estimated cost':'Custo estimado','Loading…':'Carregando…','No sessions in this period':'Nenhuma sessão neste período','Turns are read from the transcripts each account writes; the first ones show up a minute after a session starts.':'Os turnos são lidos das transcrições de cada conta; os primeiros aparecem um minuto após o início de uma sessão.','Estimated cost per day; hover a bar for active time':'Custo estimado por dia; passe o cursor sobre uma barra para ver o tempo ativo',Total:'Total',turns:'turnos'},
  ru: {Activity:'Активность',Today:'Сегодня',Day:'День',Week:'Неделя',Month:'Месяц','All accounts':'Все аккаунты',Sessions:'Сеансы','Active time':'Активное время',Turns:'Ходы','Estimated cost':'Оценка стоимости','Loading…':'Загрузка…','No sessions in this period':'За этот период сеансов нет','Turns are read from the transcripts each account writes; the first ones show up a minute after a session starts.':'Ходы читаются из журналов каждого аккаунта; первые появляются через минуту после начала сеанса.','Estimated cost per day; hover a bar for active time':'Оценка стоимости по дням; наведите на столбец, чтобы увидеть активное время',Total:'Итого',turns:'ходов'},
  uk: {Activity:'Активність',Today:'Сьогодні',Day:'День',Week:'Тиждень',Month:'Місяць','All accounts':'Усі акаунти',Sessions:'Сеанси','Active time':'Активний час',Turns:'Ходи','Estimated cost':'Оцінка вартості','Loading…':'Завантаження…','No sessions in this period':'За цей період сеансів немає','Turns are read from the transcripts each account writes; the first ones show up a minute after a session starts.':'Ходи читаються з журналів кожного акаунта; перші з’являються за хвилину після початку сеансу.','Estimated cost per day; hover a bar for active time':'Оцінка вартості за днями; наведіть на стовпчик, щоб побачити активний час',Total:'Разом',turns:'ходів'},
  zh: {Activity:'活动',Today:'今日',Day:'日',Week:'周',Month:'月','All accounts':'所有账户',Sessions:'会话','Active time':'活跃时间',Turns:'轮次','Estimated cost':'估算费用','Loading…':'正在加载…','No sessions in this period':'此期间没有会话','Turns are read from the transcripts each account writes; the first ones show up a minute after a session starts.':'轮次读取自各账户写下的记录；会话开始约一分钟后出现。','Estimated cost per day; hover a bar for active time':'每日估算费用；悬停柱条查看活跃时间',Total:'合计',turns:'轮'},
  'zh-Hant': {Activity:'活動',Today:'今日',Day:'日',Week:'週',Month:'月','All accounts':'所有帳戶',Sessions:'工作階段','Active time':'活躍時間',Turns:'輪次','Estimated cost':'估算費用','Loading…':'正在載入…','No sessions in this period':'此期間沒有工作階段','Turns are read from the transcripts each account writes; the first ones show up a minute after a session starts.':'輪次讀取自各帳戶寫下的紀錄；工作階段開始約一分鐘後出現。','Estimated cost per day; hover a bar for active time':'每日估算費用；懸停柱條查看活躍時間',Total:'合計',turns:'輪'},
  ja: {Activity:'アクティビティ',Today:'今日',Day:'日',Week:'週',Month:'月','All accounts':'すべてのアカウント',Sessions:'セッション','Active time':'稼働時間',Turns:'ターン','Estimated cost':'推定コスト','Loading…':'読み込み中…','No sessions in this period':'この期間のセッションはありません','Turns are read from the transcripts each account writes; the first ones show up a minute after a session starts.':'ターンは各アカウントのトランスクリプトから読み取ります。セッション開始から約1分で表示されます。','Estimated cost per day; hover a bar for active time':'日ごとの推定コスト。バーにポインタを合わせると稼働時間を表示',Total:'合計',turns:'ターン'},
  ko: {Activity:'활동',Today:'오늘',Day:'일',Week:'주',Month:'월','All accounts':'모든 계정',Sessions:'세션','Active time':'활동 시간',Turns:'턴','Estimated cost':'예상 비용','Loading…':'불러오는 중…','No sessions in this period':'이 기간에는 세션이 없습니다','Turns are read from the transcripts each account writes; the first ones show up a minute after a session starts.':'턴은 각 계정의 기록에서 읽습니다. 세션이 시작되고 약 1분 뒤에 나타납니다.','Estimated cost per day; hover a bar for active time':'일별 예상 비용. 막대에 포인터를 올리면 활동 시간이 표시됩니다',Total:'합계',turns:'턴'},
};
let lang = 'en', locale = 'en-US';
const t = k => (T[lang] && T[lang][k]) || k;

/* ---- State ---------------------------------------------------------------- */
const COLORS = ['#d9785a', '#2a9d8f', '#7c6fe0', '#2f80ed', '#d9538a']; // the Mac's account colours
const DAY = 86400000;
let period = 'day';
let anchor = startOfDay(new Date());
let account = '';
let data = null, loading = false, hovered = null;
try { period = localStorage.getItem('activity.period') || 'day'; } catch(e) {}

function startOfDay(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function addDays(d, n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
// [start, end) of the period that holds the anchor; weeks start on Monday
function interval(){
  if(period === 'day') return [anchor, addDays(anchor, 1)];
  if(period === 'week'){ const s = addDays(anchor, -((anchor.getDay() + 6) % 7)); return [s, addDays(s, 7)]; }
  const s = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
  return [s, new Date(anchor.getFullYear(), anchor.getMonth() + 1, 1)];
}
function shift(n){
  anchor = period === 'day' ? addDays(anchor, n)
    : period === 'week' ? addDays(anchor, 7 * n)
    : new Date(anchor.getFullYear(), anchor.getMonth() + n, 1);
  load();
}
const isCurrent = () => { const [s, e] = interval(); const now = new Date(); return now >= s && now < e; };

/* ---- Formatting ----------------------------------------------------------- */
function esc(s){ const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
function money(v){
  const c = (data && data.currency) || 'USD';
  try { return new Intl.NumberFormat(locale, { style:'currency', currency:c, maximumFractionDigits: v < 10 ? 2 : 0, minimumFractionDigits: v < 10 ? 2 : 0 }).format(v); }
  catch(e) { return v.toFixed(2) + ' ' + c; }
}
function tokens(n){ return n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? Math.round(n / 1e3) + 'k' : String(n); }
function duration(secs){
  const m = Math.floor(secs / 60);
  if(m < 60) return m + ' min';
  return m % 60 === 0 ? Math.floor(m / 60) + ' h' : Math.floor(m / 60) + ' h ' + (m % 60) + ' min';
}
function clock(ms){ return new Date(ms).toLocaleTimeString(locale, { hour:'2-digit', minute:'2-digit', hourCycle:'h23' }); }
function shortModel(m){ return String(m || '').replace('claude-', '').replace('[1m]', '').replace('openai/', ''); }
function rangeTitle(){
  const [s, e] = interval();
  const cap = x => x.charAt(0).toUpperCase() + x.slice(1);
  if(period === 'day') return cap(s.toLocaleDateString(locale, { weekday:'long', day:'numeric', month:'long', year:'numeric' }));
  if(period === 'week'){ const f = d => d.toLocaleDateString(locale, { day:'numeric', month:'short' }); return f(s) + ' – ' + f(addDays(e, -1)); }
  return cap(s.toLocaleDateString(locale, { month:'long', year:'numeric' }));
}

/* ---- Rows ----------------------------------------------------------------- */
// A session lasts from its first turn to its last, never less than two minutes, as on the Mac
const span = r => Math.max(120, r.last - r.first);
function rows(){ return !data ? [] : account ? data.rows.filter(r => r.account_id === account) : data.rows; }
function accountIndex(id){ return Math.max(0, data.accounts.findIndex(a => a.id === id)); }
function colour(r){ return COLORS[accountIndex(r.account_id) % COLORS.length]; }
function groups(list){
  const by = new Map();
  for(const r of list){ if(!by.has(r.project)) by.set(r.project, []); by.get(r.project).push(r); }
  return [...by.entries()].map(([project, rs]) => ({
    project, name: rs[0].name || project, rows: rs.sort((a, b) => a.first - b.first),
    cost: rs.reduce((a, r) => a + (r.cost || 0), 0), time: rs.reduce((a, r) => a + span(r), 0),
  })).sort((a, b) => a.cost !== b.cost ? b.cost - a.cost : b.time - a.time);
}

/* ---- Drawing -------------------------------------------------------------- */
function render(){
  document.getElementById('title').textContent = t('Activity');
  document.title = t('Activity');
  document.getElementById('range').textContent = rangeTitle();
  document.getElementById('today').textContent = t('Today');
  document.getElementById('today').disabled = isCurrent();
  document.getElementById('next').disabled = isCurrent();
  for(const b of document.querySelectorAll('#period button')){
    b.textContent = t(b.dataset.v === 'day' ? 'Day' : b.dataset.v === 'week' ? 'Week' : 'Month');
    b.classList.toggle('on', b.dataset.v === period);
  }
  const sel = document.getElementById('account');
  const options = [['', t('All accounts')], ...((data && data.accounts) || []).map(a => [a.id, a.name])];
  sel.innerHTML = options.map(([v, n]) => `<option value="${esc(v)}">${esc(n)}</option>`).join('');
  sel.value = account;
  const list = rows();
  const cost = list.reduce((a, r) => a + (r.cost || 0), 0);
  const multi = data && data.accounts.length > 1;
  document.getElementById('stats').innerHTML =
    [[t('Sessions'), list.length], [t('Active time'), duration(list.reduce((a, r) => a + span(r), 0))],
     [t('Turns'), list.reduce((a, r) => a + r.turns, 0)], [t('Estimated cost'), money(cost)]]
      .map(([l, v]) => `<div class="stat"><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join('')
    + (multi ? `<div class="legend">${data.accounts.map((a, i) => `<span><i style="background:${COLORS[i % COLORS.length]}"></i>${esc(a.name)}</span>`).join('')}</div>` : '');
  const chart = document.getElementById('chart'), projects = document.getElementById('projects');
  if(!list.length){
    chart.innerHTML = `<div class="empty"><b>${esc(loading ? t('Loading…') : t('No sessions in this period'))}</b>${loading ? '' : `<span>${esc(t('Turns are read from the transcripts each account writes; the first ones show up a minute after a session starts.'))}</span>`}</div>`;
    projects.innerHTML = '';
    return;
  }
  const gs = groups(list);
  chart.innerHTML = period === 'day' ? lanes(gs) : dayBars(list);
  projects.innerHTML = gs.map(g => `<section class="project">
    <h2>${esc(g.name)}<span>${esc(duration(g.time))}</span><b>${esc(money(g.cost))}</b></h2>
    <div class="panel">${g.rows.map(r => sessionRow(r, multi)).join('')}</div></section>`).join('');
  wireHover();
}

function lanes(gs){
  const [day] = interval();
  const hourOf = s => (s * 1000 - day.getTime()) / 3600000;
  const list = gs.flatMap(g => g.rows);
  const from = Math.max(0, Math.floor(Math.min(...list.map(r => hourOf(r.first)))) - 1);
  let to = Math.min(24, Math.floor(Math.max(...list.map(r => hourOf(r.last)))) + 2);
  to = Math.max(to, from + 4);
  const x = h => Math.min(Math.max((h - from) / (to - from), 0), 1) * 100;
  const hours = []; for(let h = from; h <= to; h++) hours.push(h);
  const ticks = hours.map(h => `<i class="tick" style="left:${x(h)}%"></i>`).join('');
  return `<div class="panel lanes">
    <div class="axis"><span></span><div class="hours">${hours.map(h => `<span style="left:${x(h)}%">${String(h).padStart(2, '0')}</span>`).join('')}</div></div>
    ${gs.map(g => `<div class="lane"><div class="who"><b>${esc(g.name)}</b><span>${esc(duration(g.time))}</span></div>
      <div class="track">${ticks}${g.rows.map(r => {
        const a = x(hourOf(r.first)), b = x(hourOf(r.last));
        return `<span class="bar" data-s="${esc(r.account_id + r.session_id)}" title="${esc((r.title || r.session_id.slice(0, 8)) + ' · ' + clock(r.first * 1000) + '–' + clock(r.last * 1000))}" style="left:${a}%;width:calc(${Math.max(b - a, 0)}% + 4px);background:${colour(r)}"></span>`;
      }).join('')}</div></div>`).join('')}
  </div>`;
}

function dayBars(list){
  const [s, e] = interval();
  const days = []; for(let d = s; d < e; d = addDays(d, 1)) days.push(d);
  const cost = new Map(), time = new Map();
  for(const r of list){
    const k = startOfDay(new Date(r.first * 1000)).getTime();
    cost.set(k, (cost.get(k) || 0) + (r.cost || 0));
    time.set(k, (time.get(k) || 0) + span(r));
  }
  const max = Math.max(0.01, ...cost.values());
  const today = startOfDay(new Date()).getTime();
  const week = period === 'week';
  const label = d => week ? d.toLocaleDateString(locale, { weekday:'short' }) : String(d.getDate());
  const total = [...cost.values()].reduce((a, v) => a + v, 0), totalTime = [...time.values()].reduce((a, v) => a + v, 0);
  return `<div class="panel days">
    <div class="cols" style="gap:${week ? 14 : 4}px">${days.map(d => {
      const k = d.getTime(), c = cost.get(k) || 0;
      return `<div class="col${k === today ? ' today' : ''}" data-day="${k}">
        <span class="v">${week && c > 0 ? esc(money(c)) : ''}</span>
        <span class="b" style="height:${Math.max(3, 120 * c / max)}px"></span>
        <span class="d">${esc(label(d))}</span></div>`;
    }).join('')}</div>
    <div class="caption"><span id="hint">${esc(t('Estimated cost per day; hover a bar for active time'))}</span>
      <span class="total">${esc(t('Total'))} ${esc(money(total))} · ${esc(duration(totalTime))}</span></div>
  </div>`;
}

function sessionRow(r, multi){
  const key = r.account_id + r.session_id;
  const name = (data.accounts.find(a => a.id === r.account_id) || {}).name || r.account_id;
  return `<div class="srow" data-s="${esc(key)}">
    <span class="strip" style="background:${colour(r)}"></span>
    <div class="when"><b>${esc(clock(r.first * 1000))} – ${esc(clock(r.last * 1000))}</b><span>${esc(duration(span(r)))}</span></div>
    <div class="what"><b>${esc(r.title || r.session_id.slice(0, 8))}</b>
      <div class="meta">${multi ? `<span class="chip" style="background:${colour(r)}26">${esc(name)}</span>` : ''}${esc(shortModel(r.model))} · ${esc(r.turns)} ${esc(t('turns'))} · ${esc(tokens(r.tokens))} tok</div></div>
    <span class="cost">${r.cost != null ? esc(money(r.cost)) : '—'}</span>
  </div>`;
}

// One session under the pointer lights up in the lanes and in the list alike, as on the Mac
function wireHover(){
  const all = document.querySelectorAll('[data-s]');
  const set = key => {
    hovered = key;
    for(const el of all){
      if(el.classList.contains('bar')) el.classList.toggle('dim', !!key && el.dataset.s !== key);
      else el.classList.toggle('hot', el.dataset.s === key);
    }
  };
  for(const el of all){ el.addEventListener('mouseenter', () => set(el.dataset.s)); el.addEventListener('mouseleave', () => set(null)); }
  const hint = document.getElementById('hint');
  if(hint){
    const base = hint.textContent;
    for(const col of document.querySelectorAll('.col[data-day]')){
      col.addEventListener('mouseenter', () => {
        const d = new Date(+col.dataset.day), list = rows().filter(r => startOfDay(new Date(r.first * 1000)).getTime() === +col.dataset.day);
        const title = d.toLocaleDateString(locale, { weekday:'short', day:'numeric', month:'short' });
        hint.textContent = `${title} · ${money(list.reduce((a, r) => a + (r.cost || 0), 0))} · ${duration(list.reduce((a, r) => a + span(r), 0))}`;
      });
      col.addEventListener('mouseleave', () => { hint.textContent = base; });
    }
  }
}

/* ---- Loading ---------------------------------------------------------------- */
let seq = 0;
function load(){
  const [s, e] = interval(), mine = ++seq;
  loading = true; render();
  invoke('get_activity_timeline', { from: Math.floor(s.getTime() / 1000), to: Math.floor(e.getTime() / 1000) - 1 })
    .then(d => { if(mine === seq){ data = d; loading = false; if(account && !d.accounts.some(a => a.id === account)) account = ''; render(); } })
    .catch(err => { if(mine === seq){ loading = false; render(); console.error(err); } });
}

document.getElementById('prev').onclick = () => shift(-1);
document.getElementById('next').onclick = () => shift(1);
document.getElementById('today').onclick = () => { anchor = startOfDay(new Date()); load(); };
document.getElementById('reload').onclick = () => load();
document.getElementById('period').onclick = e => {
  const b = e.target.closest('button'); if(!b || b.dataset.v === period) return;
  period = b.dataset.v; try { localStorage.setItem('activity.period', period); } catch(err) {}
  load();
};
document.getElementById('account').onchange = e => { account = e.target.value; render(); };
listen('costs', () => load()).catch(() => {});
listen('theme_resolved', e => { if(e.payload) document.documentElement.dataset.theme = e.payload; }).catch(() => {});
invoke('get_lang_resolved').then(l => { if(typeof l === 'string'){ lang = T[l] ? l : 'en'; locale = l === 'en' ? 'en-US' : l; render(); } }).catch(() => {});
load();
</script>
</body>
